# SAE-arm FULL Duan-exact reproduction (2026-09-08).
#
# Byte-faithful copy of the reference repo's Gemma protocol
# (sae-feature-survival-quantization-0141, scripts/03_gemma_phase3_streaming_sweep.py):
#   - tokenization: "\n\n".join(non-empty lines) -> tokenizer.encode(add_special_tokens=False)
#                   -> reshape into full L=256 blocks   (sequence_packing: duan_exact)
#   - NO BOS anywhere in the forward pass               (bos_policy: flat_stream)
#   - score ALL 256 positions                           (exclude_bos: false)
#   - float32 SAE encode: sae.encode(acts.float())      (encode_float32: true)
#   - bf16 model, no_processing (raw weights), WikiText-2-raw train, layer 12, L=256
#
# This is the TARGET config: it should reproduce Duan's INT6 ~51.30% survival /
# ~7,144 active features. The two isolation configs
# (sae_gemma2_2b_isolate_bos.yaml, sae_gemma2_2b_isolate_tok.yaml) hold this fixed
# except for one lever each, so the driver of the 47-pt gap can be attributed.
#
# NOTHING ELSE in the repo is edited: the existing sae_gemma2_2b.yaml
# (concatenate + prepend_each_block, our ~98.7% run) is kept as-is.

mode: reproduction
schema_version: 1

seeds: [0]

model:
  identifier: google/gemma-2-2b
  tokenizer_identifier: google/gemma-2-2b
  revision: main

readout:
  hook: blocks.12.hook_resid_post
  layer: 12

compression:
  method: RTN
  scheme: per_output_channel
  bit_widths: [8, 7, 6, 5, 4]
  quantized_modules:
    - attn_q
    - attn_k
    - attn_v
    - attn_o
    - mlp_in
    - mlp_out
    - mlp_gate
  excluded_modules:
    - embed
    - unembed
    - layer_norm
    - bias
  expected_rtn_module_counts:
    attn_q: 26
    attn_k: 26
    attn_v: 26
    attn_o: 26
    mlp_in: 26
    mlp_out: 26
    mlp_gate: 26

datasets:
  harmfulness:
    identifier: allenai/wildguardmix
    revision: main
    split: train
    source: https://huggingface.co/datasets/allenai/wildguardmix

corpora:
  activation:
    identifier: wikitext
    config: wikitext-2-raw-v1
    revision: "b08601e04326c79dfdd32d625aee71d232d685c3"  # pinned 2026-08-30 HEAD (HF-verified)
    split: train
    streaming: false
    source: https://huggingface.co/datasets/wikitext
  behavioral:
    identifier: wikitext
    config: wikitext-2-raw-v1
    revision: main
    split: test
    source: https://huggingface.co/datasets/wikitext

budgets:
  dry_run:
    max_examples: 16
    max_tokens: 4096
  smoke:
    max_examples: 64
    max_tokens: 8192
  full:
    max_examples: 100000
    max_tokens: 500000

statistics:
  confidence_level: 0.95
  bootstrap:
    unit: sae_feature
    n_resamples: 1000
  permutation:
    n_resamples: 1000
  multiple_testing:
    method: none

spr:
  signal_statistic: peak_abs_projection
  perturbation_statistic: mean_abs_directional_delta
  preregistered_estimator: peak_abs_projection/mean_abs_directional_delta
  eps: 1.0e-8

provenance:
  source_reference: "Duan, E. (2026). Perplexity Can Miss SAE Feature Damage Under Quantization. arXiv:2606.03002v2 [cs.LG]; code: https://anonymous.4open.science/r/sae-feature-survival-quantization-0141/ (build_tokens_2d, scripts/03)"
  corpus_id: wikitext
  corpus_config: wikitext-2-raw-v1
  corpus_split: train
  corpus_revision: "b08601e04326c79dfdd32d625aee71d232d685c3"
  # FULL Duan-exact token protocol (repo build_tokens_2d): join non-empty lines
  # with "\n\n", tokenize once with add_special_tokens=False, reshape into full
  # L=256 blocks, no BOS. See src/sae/qdm.py::pack_duan_exact_blocks.
  tokenization_protocol: duan_exact_join_encode_once_no_bos
  tokenizer_id: google/gemma-2-2b
  tokenizer_revision: "c5ebcd40d208330abc697524c919956e692655cf"
  bos_policy: flat_stream
  sequence_packing: duan_exact
  sae_release: gemma-scope-2b-pt-res
  sae_id: layer_12/width_16k/average_l0_82   # == the repo's "canonical" (registry-verified)
  sae_revision: "fd571b47c1c64851e9b1989792367b9babb4af63"

model_config:
  model:
    name: google/gemma-2-2b
    dtype: bfloat16
    device: cuda
    no_processing: true
  sae:
    release: gemma-scope-2b-pt-res
    sae_id: layer_12/width_16k/average_l0_82
    d_sae: 16384
    layer: 12
    hook: blocks.12.hook_resid_post
    # flat_stream has NO BOS -> position 0 is real content -> exclude_bos MUST be
    # false (the pipeline raises if flat_stream + exclude_bos are combined).
    exclude_bos: false
    # Match Duan's sae.encode(acts.float()).
    encode_float32: true
  corpus:
    behavioral: wikitext-2-raw
    activation: wikitext-2-raw
  perplexity:
    sliding_window_size: 2048
    stride: 512
    activation_seq_len: 256
    seq_len: 512
    n_tokens: 500000
    ppl_max_tokens: 100000

quant_config:
  # Distinct results root so this run does NOT overwrite the prior reproduction
  # outputs (default results/reproduction/) or the two isolation runs. Artifacts
  # land under results/duan_exact/reproduction/sae/. results/ is gitignored.
  results:
    root: "results/duan_exact"
    sae_survival: "results/duan_exact/reproduction/sae/survival_rates.csv"
    sae_correlations: "results/duan_exact/reproduction/sae/correlations_int6.npz"
    sae_perplexity: "results/duan_exact/reproduction/sae/perplexity.csv"
    sae_metadata: "results/duan_exact/reproduction/sae/metadata.json"
    sae_gate_report: "results/duan_exact/reproduction/sae/reproduction_gate.json"
  gate_sae_int6:
    bits: 6
    survived_target: 51.30
    degraded_target: 48.70
    damaged_target: 0.00
    tolerance_pp: 3.0
